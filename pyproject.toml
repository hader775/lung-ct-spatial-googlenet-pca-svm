[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lungct-spatial-deep-features"
version = "1.0.0"
description = "Auditable frozen GoogLeNet, patch PCA and RBF SVM lung CT classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "opencv-python-headless", "Pillow", "joblib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
